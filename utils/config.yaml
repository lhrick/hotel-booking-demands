# Caminhos relativos são resolvidos a partir da raiz do projeto.
base_path: data

layers:
  raw: raw
  bronze: bronze
  silver: silver
  gold: gold

raw_files:
  bookings: hotel_bookings.csv
  countries: country_metadata.csv
  hotels: hotel_metadata.csv

csv_options:
  header: true
  sep: ","
  nullValue: "NULL"
  # Falha em valores fora do schema explícito em vez de anulá-los silenciosamente.
  mode: FAILFAST
  # Valida os nomes do cabeçalho do CSV contra o schema explícito.
  enforceSchema: false
